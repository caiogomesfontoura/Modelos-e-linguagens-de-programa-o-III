<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Clientes</title>
    <link rel="stylesheet" th:href="@{/css/clientes.css}">
    <script th:src="@{/js/clientes.js}" defer></script>
</head>
<body>
<main class="pagina">
    <header class="cabecalho">
        <h1>Clientes</h1>
        <p class="subtitulo">Cadastre, altere e exclua os clientes.</p>
    </header>

    <section class="cartao">
        <h2>Novo cliente</h2>
        <form class="form-novo" th:action="@{/clientes}" method="post">
            <input type="text" name="nome" placeholder="Nome do cliente"
                   autocomplete="off" required>
            <button type="submit" class="botao botao-primario">Salvar</button>
        </form>
    </section>

    <section class="cartao">
        <div class="lista-topo">
            <h2>
                Lista de clientes
                <span class="contador" th:text="${#lists.size(clientes)}">0</span>
            </h2>
            <input type="search" id="busca" class="busca"
                   placeholder="Buscar pelo nome..." autocomplete="off">
        </div>

        <table class="tabela">
            <thead>
            <tr>
                <th class="col-id">ID</th>
                <th>Nome</th>
                <th class="col-acoes">Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="cliente : ${clientes}" class="linha-cliente">
                <td class="col-id" th:text="${cliente.id}"></td>
                <td>
                    <form class="form-alterar"
                          th:action="@{/clientes/{id}(id=${cliente.id})}"
                          method="post">
                        <input type="text" name="nome"
                               th:value="${cliente.nome}" required>
                        <button type="submit" class="botao botao-secundario">Alterar</button>
                    </form>
                </td>
                <td class="col-acoes">
                    <form class="form-excluir"
                          th:action="@{/clientes/{id}/excluir(id=${cliente.id})}"
                          th:data-nome="${cliente.nome}"
                          method="post">
                        <button type="submit" class="botao botao-perigo">Excluir</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(clientes)}">
                <td colspan="3" class="vazio">Nenhum cliente cadastrado ainda.</td>
            </tr>
            <tr id="sem-resultado" class="oculto">
                <td colspan="3" class="vazio">Nenhum cliente encontrado para a busca.</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
